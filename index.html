<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7fb">
<title>中国語単語テスト</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#17181b;--muted:#70737b;--line:#e4e6eb;--accent:#2f6fed;--danger:#d9485f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:520px;margin:auto;padding:24px 18px 40px} h1{font-size:28px;margin:12px 0 6px} h2{font-size:22px}.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 4px 18px rgba(0,0,0,.04)}
button{width:100%;border:0;border-radius:15px;padding:15px 16px;font-size:16px;font-weight:700;background:var(--accent);color:white;margin:7px 0;min-height:50px}
button.secondary{background:#eef1f6;color:var(--text)} button.danger{background:#fff0f2;color:var(--danger)}
button:active{transform:scale(.99)} input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:5px 0 10px}
.hidden{display:none}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.big{font-size:54px;text-align:center;padding:28px 0 12px;font-weight:800}.center{text-align:center}
.answer{background:#f8f9fc;border-radius:14px;padding:14px;margin:10px 0}.correct{border-left:5px solid #28a56a}.wrong{border-left:5px solid var(--danger)}
.small{font-size:13px;color:var(--muted)} .pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef1f6;font-size:12px;margin:2px}
.row{display:flex;gap:8px}.row button{flex:1}
label{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>🇨🇳 中国語単語テスト</h1>
  <p class="sub">音声を聞いて、簡体字・ピンイン・日本語の意味を答えよう。</p>
  <div class="card">
    <div id="stats"></div>
    <button onclick="startTest('all')">▶️ 14問テスト</button>
    <button class="secondary" onclick="startTest('wrong')">❌ 間違えた単語だけ</button>
    <button class="secondary" onclick="show('manage')">⚙️ 単語管理</button>
  </div>
  <div class="card">
    <b>使い方</b>
    <p class="small">スタート後、音声を聞きます。答えを入力する必要はありません。紙やメモに「簡体字・ピンイン・日本語」を書いて、最後に答え合わせできます。</p>
  </div>
</section>

<section id="test" class="hidden">
  <div class="top"><span id="progress"></span><span id="scoreLive"></span></div>
  <div class="card center">
    <div class="small">音声を聞いて答えてください</div>
    <div class="big">🔊</div>
    <button onclick="speakCurrent()">🔊 もう一度聞く</button>
    <button class="secondary" onclick="revealCurrent()">👁️ 答えを見る</button>
    <div id="reveal" class="answer hidden"></div>
  </div>
  <button onclick="nextQuestion()">次へ →</button>
</section>

<section id="result" class="hidden">
  <h2>テスト終了</h2>
  <div class="card center"><div id="resultSummary"></div></div>
  <div id="resultList"></div>
  <button onclick="startTest('all')">🔄 もう一度</button>
  <button class="secondary" onclick="startTest('wrong')">❌ 間違いだけ</button>
  <button class="secondary" onclick="show('home')">ホームへ</button>
</section>

<section id="manage" class="hidden">
  <h2>単語管理</h2>
  <div class="card">
    <label>簡体字</label><input id="newZh" placeholder="例：学习">
    <label>ピンイン</label><input id="newPy" placeholder="例：xuéxí">
    <label>日本語の意味</label><input id="newJa" placeholder="例：勉強する">
    <button onclick="addWord()">＋ 単語を追加</button>
  </div>
  <div id="wordList"></div>
  <button class="secondary" onclick="show('home')">← ホームへ</button>
</section>
</main>

<script>
const DEFAULT_WORDS=[
["了","le","～した／～になった"],
["怎么","zěnme","どう／どのように"],
["接","jiē","迎える／受け取る／電話に出る"],
["带","dài","持っていく／連れていく"],
["后天","hòutiān","あさって"],
["前天","qiántiān","おととい"],
["建议","jiànyì","提案する／提案"],
["历史","lìshǐ","歴史"],
["博物馆","bówùguǎn","博物館"],
["参观","cānguān","見学する／訪問する"],
["同意","tóngyì","賛成する／同意する"],
["商量","shāngliang","相談する／話し合う"],
["对面","duìmiàn","向かい／向かい側"],
["饭馆","fànguǎn","食堂／レストラン"]
];
let words=JSON.parse(localStorage.getItem("cnWords")||"null")||DEFAULT_WORDS;
let wrong=new Set(JSON.parse(localStorage.getItem("cnWrong")||"[]"));
let order=[],idx=0,results=[],mode="all";

function save(){localStorage.setItem("cnWords",JSON.stringify(words));localStorage.setItem("cnWrong",JSON.stringify([...wrong]));}
function show(id){["home","test","result","manage"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id)); if(id==="home")renderStats(); if(id==="manage")renderWords();}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startTest(m){
 mode=m; let base=m==="wrong"?words.filter(w=>wrong.has(w[0])):words;
 if(!base.length){alert("間違えた単語はありません。");return}
 order=shuffle(base);idx=0;results=[];show("test");renderQuestion();
}
function speak(text){
 if(!("speechSynthesis" in window)){alert("このブラウザでは音声合成が利用できません。");return}
 speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.82;speechSynthesis.speak(u);
}
function speakCurrent(){speak(order[idx][0])}
function renderQuestion(){
 document.getElementById("progress").textContent=`第${idx+1}問 / ${order.length}`;
 document.getElementById("scoreLive").textContent=`${results.filter(Boolean).length}問正解`;
 document.getElementById("reveal").classList.add("hidden");document.getElementById("reveal").innerHTML="";
 setTimeout(speakCurrent,180);
}
function revealCurrent(){
 let w=order[idx],el=document.getElementById("reveal");
 el.innerHTML=`<b>${w[0]}</b><br>${w[1]}<br>${w[2]}`;el.classList.remove("hidden");
}
function nextQuestion(){
 let shown=!document.getElementById("reveal").classList.contains("hidden");
 if(!shown){
   let ok=confirm("答えを見ずに次へ進みますか？\\n「キャンセル」で答えを確認できます。");
   if(!ok){revealCurrent();return}
 }
 let w=order[idx];
 let isCorrect=confirm(`${w[0]}\\n\\n自分の回答は正解でしたか？\\n\\nOK＝正解 / キャンセル＝不正解`);
 results.push(isCorrect);
 if(isCorrect) wrong.delete(w[0]); else wrong.add(w[0]); save();
 idx++;
 if(idx<order.length){renderQuestion()}else finish();
}
function finish(){
 show("result");let n=results.filter(Boolean).length;
 document.getElementById("resultSummary").innerHTML=`<div style="font-size:38px;font-weight:800">${n} / ${order.length}</div><p>${Math.round(n/order.length*100)}%</p>`;
 document.getElementById("resultList").innerHTML=order.map((w,i)=>`<div class="card ${results[i]?"correct":"wrong"}"><b>${i+1}. ${w[0]}</b><br>${w[1]}<br>${w[2]}<br><span class="small">${results[i]?"正解":"不正解"}</span></div>`).join("");
}
function renderStats(){document.getElementById("stats").innerHTML=`<span class="pill">登録：${words.length}語</span><span class="pill">間違い：${wrong.size}語</span>`}
function renderWords(){
 document.getElementById("wordList").innerHTML=words.map((w,i)=>`<div class="card"><b>${w[0]}</b>　${w[1]}<br>${w[2]}<button class="danger" onclick="removeWord(${i})">🗑️ 削除</button></div>`).join("");
}
function addWord(){
 let z=document.getElementById("newZh").value.trim(),p=document.getElementById("newPy").value.trim(),j=document.getElementById("newJa").value.trim();
 if(!z||!p||!j){alert("3項目すべて入力してください。");return}
 if(words.some(w=>w[0]===z)){alert("その単語はすでに登録されています。");return}
 words.push([z,p,j]);save();["newZh","newPy","newJa"].forEach(id=>document.getElementById(id).value="");renderWords();
}
function removeWord(i){if(confirm(`「${words[i][0]}」を削除しますか？`)){wrong.delete(words[i][0]);words.splice(i,1);save();renderWords()}}
renderStats();
</script>
</body>
</html>
